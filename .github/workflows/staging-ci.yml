name: Staging CI & Integration Tests

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jre_user
          POSTGRES_PASSWORD: jre_staging_password
          POSTGRES_DB: jre_staging_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install C toolchain for PySwisseph
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      # requirements.txt is a generated mirror of pyproject.toml — fail fast
      # on drift instead of letting CI test against stale dependencies.
      - name: Guard requirements.txt sync with pyproject.toml
        run: python scripts/sync_requirements.py --check

      # Single source of truth: install the project itself from pyproject.toml.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg://jre_user:jre_staging_password@localhost:5432/jre_staging_db
        run: |
          alembic upgrade head

      # Drift gate: fails when src/jrs/db/models.py changed without a
      # matching migration script. Needs the db AT head, hence the step order.
      - name: Detect model/migration drift (alembic check)
        env:
          DATABASE_URL: postgresql+psycopg://jre_user:jre_staging_password@localhost:5432/jre_staging_db
        run: |
          alembic check

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://jre_user:jre_staging_password@localhost:5432/jre_staging_db
        run: |
          pytest

  # Continuous deployment to the staging host. Dormant until the optional
  # secrets below are configured — the deploy step self-skips without them.
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging host
        env:
          # Optional. Without these the job exits successfully and deploys nothing.
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_DIR: ${{ vars.STAGING_APP_DIR }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$APP_DIR" ]; then
            echo "::notice::Staging deploy secrets not configured — skipping deploy."
            echo "Set STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY and the"
            echo "STAGING_APP_DIR variable to enable automatic staging deploys."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          SSH_KEY_FILE=~/.ssh/staging_deploy_key DEPLOY_MODE=ssh \
            bash scripts/deploy_staging.sh
