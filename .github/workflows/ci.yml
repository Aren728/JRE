name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Superseded runs on the same ref are cancelled so the queue stays short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install C dependencies for PySwisseph
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # requirements.txt is a generated mirror of pyproject.toml — fail fast on drift.
      - name: Guard requirements.txt sync with pyproject.toml
        run: python scripts/sync_requirements.py --check

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov

      # Lint/type pins match the versions the gates were validated against;
      # bump deliberately, never transitively.
      - name: Install lint & type gates
        run: pip install mypy==2.3.1 ruff==0.16.8

      # Engine packages (everything under src/ except the excluded legacy
      # surface) must stay lint-clean — enforced via force-exclude +
      # extend-exclude in pyproject.toml.
      - name: Ruff (production code)
        run: ruff check src tests/unit/spatial_grid tests/test_requirements_sync.py

      # strict = true is the enforced default; the [[tool.mypy.overrides]]
      # grandfather list in pyproject.toml is the shrinking debt registry.
      - name: Mypy (strict)
        run: mypy
        env:
          MYPYPATH: src

      # Explicit enforcement of the pytest config knob (belt and braces: the
      # config value is authoritative, this probe fails loudly if someone
      # flips it off and a future xpass slips through silently).
      - name: Verify xfail_strict is enforced
        run: |
          python - <<'PY'
          in_pytest_section = False
          found = False
          for line in open("pyproject.toml", encoding="utf-8"):
              stripped = line.strip()
              if stripped.startswith("["):
                  in_pytest_section = stripped.startswith("[tool.pytest.ini_options]")
              if in_pytest_section and stripped.startswith("xfail_strict"):
                  assert stripped.split("=", 1)[1].strip().lower() == "true", (
                      "xfail_strict must be true in [tool.pytest.ini_options]"
                  )
                  found = True
          assert found, "xfail_strict missing from [tool.pytest.ini_options]"
          print("xfail_strict = true: enforced")
          PY

      - name: Run Backend Pytest Suite
        run: |
          pytest tests/ --doctest-modules -v

  frontend-build-and-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The studio surface (store, lib, studio components, chart page, its tests)
      # is lint-clean, so it is gated. The rest of the app still carries legacy
      # lint debt; widen this script as that debt is paid down.
      - name: Lint the studio surface
        run: npm run lint:studio

      - name: Run Frontend Tests
        run: npm test -- --ci --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Build Next.js Production App
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ENABLE_EXPERIMENTAL_VARGAS: 'true'
          NEXT_PUBLIC_ENABLE_ADVANCED_YOGA: 'true'
        run: npm run build

  golden-state-verify:
    name: Verify Golden-State Intermediate Hashes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install C dependencies for PySwisseph
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate golden-state manifests
        run: python scripts/generate_golden_states.py generate

      - name: Verify golden-state intermediate hashes
        run: python scripts/generate_golden_states.py verify


  benchmark-eval:
    name: Frozen Benchmark Corpus Gate (Phase F4)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install C dependencies for PySwisseph
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate benchmark corpus manifest
        run: python scripts/run_benchmark_eval.py --write-manifest

      - name: Verify benchmark corpus invariants
        run: python scripts/run_benchmark_eval.py --verify-only

      - name: Execute frozen benchmark evaluation (Phase F4 gate)
        run: python scripts/run_benchmark_eval.py

      # Phase 6 (Track B): pin the served OpenAPI 3.1 contract — native
      # 3.1 emission, stable operationIds, resolvable components/refs.
      - name: Verify OpenAPI 3.1 contract
        run: python scripts/verify_openapi_contract.py

  docker-compose-check:
    name: Docker Staging Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build-and-test, golden-state-verify]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start Docker Compose stack
        run: |
          docker compose -f docker-compose.staging.yml up --build -d

      # Retry loop instead of a fixed sleep: sleep-based readiness is flaky
      # under runner load; the E2E job already uses this pattern.
      - name: Check Backend Health Endpoint
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            http://localhost:8000/api/v1/health

      - name: Smoke Test Chart Analysis Endpoint
        run: |
          curl --fail -X POST http://localhost:8000/api/v1/analyze \
            -H "Content-Type: application/json" \
            -d '{"date": "1995-10-24", "time": "14:30:00", "latitude": 13.0827, "longitude": 80.2707, "timezone": "Asia/Kolkata"}'

      # Proves the staging image of the frontend actually serves, not just builds.
      - name: Smoke Test Frontend
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f docker-compose.staging.yml down

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12 (backend for E2E)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install C dependencies for PySwisseph
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install frontend dependencies
        run: npm ci

      # Installed after npm ci so the browser revision matches the pinned
      # @playwright/test version instead of whatever npx happens to fetch.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start backend API
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          nohup python -m uvicorn src.jrs.api.main:app --port 8000 > /tmp/backend.log 2>&1 &
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8000/api/v1/health

      # PORT must be one of the backend's allowed CORS origins
      # (ALLOWED_ORIGINS in src/jrs/api/main.py: 3000, 3001, 5173) or every
      # browser request to the engine is blocked by the preflight check.
      - name: Run Playwright tests
        env:
          PORT: '3001'
          API_URL: http://localhost:8000
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

      - name: Dump backend log on failure
        if: failure()
        run: tail -50 /tmp/backend.log
