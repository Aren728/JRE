name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install C dependencies for PySwisseph
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Backend Pytest Suite
        run: |
          pytest tests/ --doctest-modules -v

  frontend-build-and-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm test

      - name: Build Next.js Production App
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ENABLE_EXPERIMENTAL_VARGAS: 'true'
          NEXT_PUBLIC_ENABLE_ADVANCED_YOGA: 'true'
        run: npm run build

  docker-compose-check:
    name: Docker Staging Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build-and-test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start Docker Compose stack
        run: |
          docker compose -f docker-compose.staging.yml up --build -d

      - name: Wait for services to be ready
        run: sleep 10

      - name: Check Backend Health Endpoint
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/api/v1/health

      - name: Smoke Test Chart Analysis Endpoint
        run: |
          curl --fail -X POST http://localhost:8000/api/v1/analyze \
            -H "Content-Type: application/json" \
            -d '{"date": "1995-10-24", "time": "14:30:00", "latitude": 13.0827, "longitude": 80.2707, "timezone": "Asia/Kolkata"}'

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f docker-compose.staging.yml down

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12 (backend for E2E)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install C dependencies for PySwisseph
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: npm ci

      - name: Start backend API
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          nohup python -m uvicorn src.jrs.api.main:app --port 8000 > /tmp/backend.log 2>&1 &
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8000/api/v1/health

      - name: Run Playwright tests
        env:
          PORT: '3001'
          API_URL: http://localhost:8000
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

      - name: Dump backend log on failure
        if: failure()
        run: tail -50 /tmp/backend.log
