[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jre"
version = "1.1.0rc1"
description = "JRE — Jyotish Reasoning Engine: deterministic astronomical core (JRE-002) and Jyotish coordinate/state layer (JRE-003)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary (see docs; Swiss Ephemeris data licensing applies)" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pysweph>=2.10.3.5,<3.0.0",
    "tzdata>=2024.1",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
package-dir = { "" = "src" }
# Automatic discovery instead of a manual allowlist: every src/<dir> with an
# __init__.py is packaged, and namespace subpackages (no __init__.py, e.g.
# jrs.services, jrs.domains) are found as well. This keeps `pip install .`
# (used by Dockerfile.backend) in sync with the source tree so new jrs.*
# subpackages can never silently go missing from the built image again.
packages.find = { where = ["src"] }

[tool.pytest.ini_options]
testpaths = [
    "tests/unit/astronomy",
    "tests/integration/astronomy",
    "tests/unit/jyotish",
    "tests/integration/jyotish",
    "tests/unit/knowledge",
    "tests/integration/knowledge",
    "tests/unit/bhava",
    "tests/integration/bhava",
    "tests/unit/gochar",
    "tests/integration/gochar",
    "tests/unit/context",
    "tests/integration/context",
    "tests/unit/varga",
    "tests/integration/varga",
    "tests/unit/research",
    "tests/integration/research",
    "tests/unit/dasha",
    "tests/integration/dasha",
    "tests/unit/bala",
    "tests/integration/bala",
    "tests/unit/drik",
    "tests/integration/drik",
    "tests/unit/yoga",
    "tests/integration/yoga",
    "tests/unit/karaka",
    "tests/integration/karaka",
    "tests/unit/avastha",
    "tests/integration/avastha",
    "tests/unit/ashtakavarga",
    "tests/integration/ashtakavarga",
    "tests/unit/tajika",
    "tests/integration/tajika",
    "tests/unit/jaimini",
    "tests/integration/jaimini",
    "tests/unit/prashna",
    "tests/integration/prashna",
    "tests/unit/muhurta",
    "tests/integration/muhurta",
    "tests/unit/rectification",
    "tests/integration/rectification",
    "tests/unit/synthesis",
    "tests/integration/synthesis",
    "tests/unit/jrs",
    "tests/integration/jrs",
    "tests/unit/jrs/graph",
    "tests/unit/jrs/evidence",
    "tests/integration/jrs/evidence",
    "tests/unit/jrs/domains/marriage",
    "tests/unit/jrs/domains/career",
    "tests/unit/jrs/domains/wealth",
    "tests/unit/jrs/domains/traits",
    "tests/unit/jrs/temporal",
    "tests/integration/jrs/temporal",
    "tests/unit/jrs/convergence",
    "tests/integration/jrs/convergence",
    "tests/unit/jrs/cross_domain",
    "tests/unit/jrs/transitions",
    "tests/unit/jrs/rectification",
    "tests/unit/jrs/multisystem",
    "tests/integration/jrs/multisystem",
    "tests/unit/validation",
    "tests/integration/validation",
    "tests/unit/nakshatra_activation",
    "tests/unit/birth_signature",
    "tests/unit/western",
    "tests/unit/jrs/western",
    "tests/unit/numerology",
    "tests/unit/jrs/numerology",
    "tests/integration/numerology",
    "tests/unit/spatial_grid",
    "tests/unit/jrs/api",
    "tests/unit/jrs/reporting",
    "tests/unit/jrs/advanced_charts",
    "tests/calibration",
    "tests/test_requirements_sync.py",
]
addopts = "-q --ignore-glob=tests/load/*"
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (full calibration runs across all domains)",
    "no_cover: marks tests excluded from coverage reporting (performance/infrastructure)",
    "locust: load tests requiring the locust package (run explicitly with -m locust)",
]
xfail_strict = true
# The load-test folder needs the optional locust package; run it with
# locust -f tests/load/locustfile.py, not pytest.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

# integration tests require pysweph + the bundled .se1 files (datasets/ephemeris)

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Make extend-exclude apply even when paths are passed explicitly on the CLI
# (CI gates run `ruff check src`).
force-exclude = true
# Legacy API/reporting surface carries pre-existing lint debt (~2000 findings:
# line length, unused imports, import order). It is excluded so `ruff check`
# can gate CI hard today; the exclusion SHRINKS as debt is paid down. Engine
# packages (astronomy, jyotish, bhava, bala, spatial_grid, geospatial, ...)
# and all of tests/ are fully enforced.
extend-exclude = ["src/jrs", "src/test_aspects.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM117"]

[tool.mypy]
python_version = "3.12"
packages = ["astronomy", "jyotish", "knowledge", "bhava", "gochar", "context", "varga", "research", "dasha", "bala", "drik", "yoga", "karaka", "avastha", "ashtakavarga", "tajika", "jaimini", "prashna", "muhurta", "rectification", "synthesis", "jrs", "validation", "nakshatra_activation", "birth_signature", "western", "numerology", "spatial_grid", "geospatial"]
strict = true

# pysweph ships no type stubs; the adapters confine the untyped surface.
[[tool.mypy.overrides]]
module = ["swisseph"]
ignore_missing_imports = true

# ── Legacy strict-mypy grandfather list ────────────────────────────────────
# `strict = true` is the enforced default (hard CI gate). These 10 legacy
# modules predate the gate and carry ~88 strict errors between them; each is
# explicitly exempted here so the gate passes TODAY while the list itself
# acts as the debt registry. Remove an entry only after fixing its errors —
# the list must shrink, never grow. New modules are NOT eligible.
[[tool.mypy.overrides]]
module = [
    "jrs.validation.calibration",
    "jrs.prediction_engine.panchang_engine",
    "jrs.deterministic_engine.esoteric_evaluator",
    "jrs.reporting.narrative_engines.timeline_engine",
    "jrs.validation.datasets.loader",
    "jrs.reporting.jatakam_book_generator",
    "jrs.reporting.pdf_generator",
    "jrs.prediction_engine.parivartana",
    "jrs.graph.functional_lordship",
    "jrs.deterministic_engine.i18n_loader",
]
ignore_errors = true
