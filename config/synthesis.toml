# JRE-022 default configuration.
# TOML is authoritative; every default is declared here (no hidden
# defaults). A config missing any declared field is a load error.

[synthesis]
version = "0.1.0"

# Score thresholds for mapping aggregate score to strength enum.
# strength_thresholds: list of (lower_bound, strength_label) pairs.
# Evaluated in order; first match wins.
[synthesis.strength_thresholds]
VERY_STRONG = 8.0
STRONG = 6.0
MODERATE = 4.0
WEAK = 2.0
VERY_WEAK = 0.0

# Score range: minimum and maximum possible aggregate scores.
[synthesis.score_range]
min_score = 0.0
max_score = 10.0

# Classical rule matrix: each rule defines a condition and its score weight.
# Rules are grouped by category.  Each rule has:
#   condition_type — the type of structural condition to check
#   condition_params — parameters for the condition (varies by type)
#   weight — the score adjustment when the condition is met

# ------------------------------------------------------------------ #
# Condition types supported:
#   YOGA_PRESENT         — check if a Yoga ID exists in the input
#   YOGA_ABSENT          — check if a Yoga ID is absent
#   BALA_ABOVE           — check if a Bala value exceeds a threshold
#   BALA_BELOW           — check if a Bala value is below a threshold
#   DASHA_LORD_IS        — check if the current Dasha lord matches
#   PLANET_IN_HOUSE      — check if a planet occupies a house
#   PLANET_ASPECTS_HOUSE — check if a planet aspects a house
#   HOUSE_LORD_IN_HOUSE  — check if a house lord occupies another house
#   ASHTAKAVARGA_ABOVE   — check if Ashtakavarga score exceeds threshold
#   AVASTHA_STATE        — check if a planet is in a specific Avastha
#   KARAKA_PRESENT       — check if a Karaka condition is met
#   COMBINED_AND         — all sub-conditions must be met
#   COMBINED_OR          — any sub-condition must be met
# ------------------------------------------------------------------ #

# ------------------------------------------------------------------ #
# CAREER rules
# ------------------------------------------------------------------ #
[[synthesis.rules.CAREER]]
condition_type = "YOGA_PRESENT"
condition_params = { yoga_id = "RAJA_YOGA" }
weight = 3.0

[[synthesis.rules.CAREER]]
condition_type = "BALA_ABOVE"
condition_params = { planet = "SUN", bala_type = "SHADBALA", threshold = 5.0 }
weight = 1.5

[[synthesis.rules.CAREER]]
condition_type = "PLANET_IN_HOUSE"
condition_params = { planet = "SUN", house = 10 }
weight = 2.0

[[synthesis.rules.CAREER]]
condition_type = "DASHA_LORD_IS"
condition_params = { planet = "SUN" }
weight = 1.0

[[synthesis.rules.CAREER]]
condition_type = "PLANET_IN_HOUSE"
condition_params = { planet = "JUPITER", house = 10 }
weight = 1.5

[[synthesis.rules.CAREER]]
condition_type = "HOUSE_LORD_IN_HOUSE"
condition_params = { from_house = 10, to_house = 1 }
weight = 1.0

