# ══════════════════════════════════════════════════════════════════════════════
# EGYPTIAN TERMS/BOUNDS (Degree-level rulership within signs)
# Source: Dorotheus of Sidon C.I.14, Lilly CA Ch. 32
#
# Each 30° sign is divided into 5 bounds of unequal length, each
# ruled by a different planet.  When a planet occupies a bound ruled
# by a benefic (Jupiter, Venus), it receives additional essential
# dignity.  When in a malefic's bound (Saturn, Mars), it loses power.
# ══════════════════════════════════════════════════════════════════════════════

[[western.rules]]
rule_id = "W-TERM-JUPITER"
description = "Planet in Jupiter-ruled term — additional essential dignity from jovial bound (Dorotheus C.I.14)"
condition_facts = ["term_ruler=JUPITER"]
outcome = "FINANCIAL_GAIN"
direction = "SUPPORT"
strength = "MODERATE"
source_id = "DOROTHEUS"
location = "Carmen Astrologicum I.14"

[[western.rules]]
rule_id = "W-TERM-VENUS"
description = "Planet in Venus-ruled term — additional essential dignity from venereal bound (Dorotheus C.I.14)"
condition_facts = ["term_ruler=VENUS"]
outcome = "RELATIONSHIP_HARMONY"
direction = "SUPPORT"
strength = "MODERATE"
source_id = "DOROTHEUS"
location = "Carmen Astrologicum I.14"

[[western.rules]]
rule_id = "W-TERM-SATURN"
description = "Planet in Saturn-ruled term — essential debility from saturnine bound (Lilly CA Ch. 32)"
condition_facts = ["term_ruler=SATURN"]
outcome = "EMOTIONAL_TENSION"
direction = "SUPPORT"
strength = "LOW"
source_id = "LILLY"
location = "Christian Astrology Ch. 32"

[[western.rules]]
rule_id = "W-TERM-MARS"
description = "Planet in Mars-ruled term — essential debility from martial bound (Lilly CA Ch. 32)"
condition_facts = ["term_ruler=MARS"]
outcome = "EMOTIONAL_TENSION"
direction = "SUPPORT"
strength = "LOW"
source_id = "LILLY"
location = "Christian Astrology Ch. 32"

