# JRS-069: Traditional Western Doctrine Rules
# Classical sources: Ptolemy (Tetrabiblos), William Lilly (Christian Astrology),
# Abu Ma'shar (Introductorium Maius via Latin tradition), Dorotheus of Sidon,
# Bonatti (Liber Astronomiae), Morinus.
# NO modern pop-psychology interpretations.

[western]
version = "2.0"
source_id = "LILLY"
default_strength = "MODERATE"

# ══════════════════════════════════════════════════════════════════════════════
# SECT RULES (Diurnal/Nocturnal modifications to planetary dignity)
# Source: Lilly CA Ch. 21, Bonatti Tr. 5, Dorotheus C.I.4
#
# Sect classifies charts as diurnal (Sun above horizon) or nocturnal
# (Sun below horizon).  Diurnal planets (Sun, Jupiter, Saturn) are
# empowered in diurnal charts; nocturnal planets (Moon, Venus, Mars)
# are empowered in nocturnal charts.
# ══════════════════════════════════════════════════════════════════════════════

# ── Diurnal sect: diurnal planets in diurnal charts ─────────────────────────

[[western.rules]]
rule_id = "W-SECT-SUN-DIURNAL"
description = "Sun in diurnal chart — diurnal sect strengthens solar authority (Lilly CA Ch. 21)"
condition_facts = ["chart_sect=DIURNAL"]
outcome = "LEADERSHIP_AUTHORITY"
direction = "SUPPORT"
strength = "HIGH"
source_id = "LILLY"
location = "Christian Astrology Ch. 21"

[[western.rules]]
rule_id = "W-SECT-JUPITER-DIURNAL"
description = "Jupiter in diurnal chart — diurnal sect enhances Jupiter's benevolence (Lilly CA Ch. 21)"
condition_facts = ["chart_sect=DIURNAL"]
outcome = "FINANCIAL_GAIN"
direction = "SUPPORT"
strength = "MODERATE"
source_id = "LILLY"
location = "Christian Astrology Ch. 21"

[[western.rules]]
rule_id = "W-SECT-SATURN-DIURNAL"
description = "Saturn in diurnal chart — diurnal sect tempers Saturn's malefic nature (Lilly CA Ch. 21)"
condition_facts = ["chart_sect=DIURNAL"]
outcome = "EMOTIONAL_TENSION"
direction = "MITIGATE"
strength = "MODERATE"
source_id = "LILLY"
location = "Christian Astrology Ch. 21"

