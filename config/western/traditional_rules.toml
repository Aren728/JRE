# ══════════════════════════════════════════════════════════════════════════════
# PLANETARY JOYS (Classical house assignments)
# Source: Ptolemy Tetrabiblos III.13, Lilly CA Ch. 21
#
# Each classical planet has a preferred house placement (its "joy"):
#   Sun = 9th, Moon = 3rd, Mercury = 1st, Venus = 5th,
#   Mars = 6th, Jupiter = 11th, Saturn = 12th
# When a planet occupies its joy house, it operates with greater
# facility and natural expression.
# ══════════════════════════════════════════════════════════════════════════════

[[western.rules]]
rule_id = "W-JOY-SUN-9"
description = "Sun in 9th house — solar joy, natural authority in philosophy and law (Ptolemy Tetrabiblos III.13)"
