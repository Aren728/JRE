# JRS-069: Classical Corpus — Western Astrology Expanded Rules
# Classical sources: Ptolemy (Tetrabiblos), William Lilly (Christian Astrology),
# Firmicus Maternus (Mathesis), Paulus Alexandrinus (Introductio),
# Abu Ma'shar (via Latin tradition), Dorotheus of Sidon, Bonatti.
# NO modern pop-psychology interpretations.

# ══════════════════════════════════════════════════════════════════════════════
# EXCLUSION POLICY — Modern/Unsupported interpretations are PROHIBITED.
#
# The following categories are explicitly excluded from this catalog:
#
# EXCLUDED-001: Modern psychological interpretations
#   "Sun in 1st = narcissistic personality"
#   "Venus in 7th = codependency patterns"
#   "Saturn return = midlife crisis inevitability"
#   Reason: Pop-psychology overlay. Classical texts describe aptitudes,
#   not personality disorders.
#
# EXCLUDED-002: Pop-astrology claims
#   "Mercury retrograde = communication breakdowns"
#   "Mars retrograde = suppressed anger"
#   "Venus retrograde = relationship karma"
#   Reason: Retrogradation is a visibility/direction phenomenon, not an
#   emotional state.  Classical texts (Ptolemy II.9) describe visibility
#   effects on planetary function, not psychological states.
#
# EXCLUDED-003: Modern system inventions
#   "Chiron = wound and healer archetype"
#   "Pluto transit = transformation imperative"
#   "North Node = life purpose / karmic direction"
#   Reason: 20th-century inventions with no classical basis.  Chiron
#   discovered 1977; Pluto 1930.  Classical texts use 7 visible planets.
#
# EXCLUDED-004: Unsupported Hellenistic fringe
#   "Void of course Moon = nothing will come of the matter"
#   Reason: Over-simplified.  Classical sources (Dorotheus, Lilly) note
#   void Moon as a timing factor, not an absolute negation.
#
# EXCLUDED-005: Pop-astrology personality types
#   "Big Three (Sun/Moon/Rising) = personality trinity"
#   Reason: Modern pop-astrology simplification.  Classical texts treat
#   these as separate functional domains (vitality, emotion, temperament).
# ══════════════════════════════════════════════════════════════════════════════

[western]
version = "3.0"
source_id = "PTOLEMY"
default_strength = "MODERATE"

# ══════════════════════════════════════════════════════════════════════════════
# DECANS (Chaldean/Ptolemaic decan rulers)
# Source: Firmicus Maternus Mathesis II.16, Paulus Alexandrinus Introductio 11,
#        Lilly CA Ch. 27
#
# Each 30° sign is divided into 3 decans of 10° each.  Each decan has
# a ruling planet (Chaldean order: Saturn, Jupiter, Mars, Sun, Venus,
# Mercury, Moon — repeating).  The decan ruler adds a secondary
# influence that modifies the sign ruler's expression.
#
# The Chaldean decan ruler sequence for each sign is:
#   Aries (0): Mars, Sun, Jupiter  (starts from sign ruler Mars)
#   Taurus (1): Venus, Mercury, Saturn
#   Gemini (2): Mercury, Jupiter, Mars
#   Cancer (3): Moon, Saturn, Jupiter
#   Leo (4): Sun, Jupiter, Mars
#   Virgo (5): Mercury, Venus, Saturn
#   Libra (6): Venus, Mars, Jupiter
#   Scorpio (7): Mars, Moon, Venus
#   Sagittarius (8): Jupiter, Mercury, Venus
#   Capricorn (9): Saturn, Mars, Sun
#   Aquarius (10): Saturn, Mercury, Jupiter
#   Pisces (11): Jupiter, Venus, Mercury
# ══════════════════════════════════════════════════════════════════════════════

