[jrs.routing.GENERAL]
required_engines = [
    "bhava", "bala", "dasha", "yoga", "karaka",
]
research_topics = ["general_chart_analysis"]
required_houses = [1]

# ── Engine Selection Hints ──
# Optional engines that may be triggered by specific context flags
[jrs.engine_hints]
tajika_if_annual = true
jaimini_if_lagna_known = true
rectification_if_events_provided = true
muhurta_if_electional = true
prashna_if_query_time_provided = true
