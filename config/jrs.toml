[jrs.routing.CHILDREN]
required_engines = [
    "bhava", "bala", "dasha", "drik", "yoga", "karaka",
]
research_topics = ["children_indicators", "5th_house_analysis", "jupiter_upapada"]
required_houses = [5, 11]

[jrs.routing.LITIGATION]
required_engines = [
    "bhava", "bala", "dasha", "drik", "yoga", "karaka",
]
research_topics = ["litigation_indicators", "mars_saturn_conflict", "6th_house_rules"]
required_houses = [6, 12]

[jrs.routing.TRAVEL]
required_engines = [
    "bhava", "dasha", "yoga", "karaka",
]
research_topics = ["travel_indicators", "9th_12th_house_analysis"]
