[jrs]
version = "1.0"
default_research_depth = "standard"

# ── Routing Matrix ──
# Each query category maps to:
#   required_engines     – JRE modules to invoke
#   research_topics      – topics for the Research Worker
#   required_houses      – houses relevant to this category (advisory)

[jrs.routing.CAREER]
required_engines = [
    "bhava", "bala", "dasha", "yoga", "karaka", "ashtakavarga",
]
research_topics = ["career_indicators", "saturn_in_10th", "mercury_dasha_effects"]
required_houses = [10, 6]

[jrs.routing.WEALTH]
required_engines = [
    "bhava", "bala", "dasha", "yoga", "karaka", "ashtakavarga",
]
research_topics = ["wealth_indicators", "jupiter_yoga", "2nd_11th_house_rules"]
required_houses = [2, 11]

[jrs.routing.MARRIAGE]
required_engines = [
    "bhava", "bala", "dasha", "drik", "yoga", "karaka", "avastha",
]
research_topics = ["marriage_indicators", "venus_yoga", "7th_house_analysis"]
required_houses = [7, 2]

[jrs.routing.HEALTH]
required_engines = [
    "bhava", "bala", "dasha", "yoga", "karaka", "avastha",
]
research_topics = ["health_indicators", "mars_saturn_analysis", "6th_8th_house_rules"]
required_houses = [1, 6, 8]

[jrs.routing.EDUCATION]
