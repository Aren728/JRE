[marriage]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Marriage Rules ──
# Each rule maps JRE facts to a MarriageOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.
#
# Condition formats:
#   fact_name          – truthy check
#   fact_name=value    – equality
#   fact_name>value    – greater-than
#   fact_name<value    – less-than
#   fact_name>=value   – greater-or-equal
#   fact_name<=value   – less-or-equal
#   fact_name in (v1,v2) – membership

# ── Marriage Formation ──

[[marriage.rules]]
rule_id = "R-MARR-FORM-001"
description = "7th lord in Kendra or Trikona indicates timely marriage formation"
condition_facts = ["7th_lord_in_kendra_or_trikona=true"]
outcome = "MARRIAGE_FORMATION"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 7, Verse 12"

[[marriage.rules]]
rule_id = "R-MARR-FORM-002"
description = "Venus in strong dignity (bala > 6.0) supports marriage formation"
