# ══════════════════════════════════════════════════════════════════════════════
# Relationship Boundary Rules (JRS-059)
# Source-backed classical rules for subsequent unions, separation,
# prolonged distance, and unusual relationship configurations.
#
# STRICT METHODOLOGICAL NOTE:
# Every rule below is pinned to an explicit classical text reference.
# No unusual/kinship-related rules have been manufactured by combining
# unrelated house significations.  Where no source-pinned rule exists
# for a specific configuration, a comment states so.
# ══════════════════════════════════════════════════════════════════════════════

# ── Subsequent Unions / Remarriage ──────────────────────────────────────────
# These rules identify configurations that indicate a second marriage after
# divorce, distinguished from remarriage after spouse death.

