[wealth]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Wealth Rules ──
# Each rule maps JRE facts to a WealthOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Wealth Accumulation ──

[[wealth.rules]]
rule_id = "R-WEALTH-ACC-001"
description = "2nd lord in 11th — wealth accumulation through earned income"
condition_facts = ["2nd_lord_in_11th=true"]
outcome = "WEALTH_ACCUMULATION"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 14, Verse 5"

[[wealth.rules]]
rule_id = "R-WEALTH-ACC-002"
description = "Jupiter strong with 2nd/11th connection — sustained wealth accumulation"
condition_facts = ["jupiter_strong=true", "jupiter_2nd_or_11th_connection=true"]
outcome = "WEALTH_ACCUMULATION"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 14, Verse 8"

