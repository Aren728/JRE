[spirituality]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Spirituality Rules ──
# Each rule maps JRE facts to a SpiritualityOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Spiritual Awakening ──

[[spirituality.rules]]
rule_id = "R-SPIR-AWK-001"
description = "Ketu strong with Jupiter — spiritual awakening"
condition_facts = ["ketu_strong=true", "jupiter_strong=true"]
outcome = "SPIRITUAL_AWAKENING"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 20, Verse 2"

