[career]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Career Rules ──
# Each rule maps JRE facts to a CareerOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Career Ascent ──

[[career.rules]]
rule_id = "R-CAREER-ASC-001"
description = "10th lord in Kendra or Trikona — career ascent indicator"
condition_facts = ["10th_lord_in_kendra_or_trikona=true"]
outcome = "CAREER_ASCENT"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 10, Verse 5"

