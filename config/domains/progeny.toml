[progeny]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Progeny Rules ──
# Each rule maps JRE facts to a ProgenyOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Easy Conception ──

[[progeny.rules]]
rule_id = "R-PROG-EASY-001"
description = "Jupiter strong with 5th lord in kendra — easy conception"
condition_facts = ["jupiter_strong=true", "5th_lord_in_kendra=true"]
outcome = "EASY_CONCEPTION"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 16, Verse 2"

[[progeny.rules]]
rule_id = "R-PROG-EASY-002"
description = "Venus strong with Jupiter aspecting 5th — easy conception"
condition_facts = ["venus_strong=true", "jupiter_aspecting_5th=true"]
outcome = "EASY_CONCEPTION"
direction = "SUPPORT"
strength = "MODERATE"
source_id = "BPHS"
location = "Chapter 16, Verse 4"

