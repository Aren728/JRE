[transitions]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Transitions Rules ──
# Each rule maps JRE facts to a TransitionOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Life Phase Shift ──

[[transitions.rules]]
rule_id = "R-TRNS-PHASE-001"
description = "Saturn return at critical degree — life phase shift"
condition_facts = ["saturn_return=true"]
outcome = "LIFE_PHASE_SHIFT"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 19, Verse 2"

[[transitions.rules]]
rule_id = "R-TRNS-PHASE-002"
description = "Jupiter-Ketu conjunction — life phase shift through wisdom"
condition_facts = ["jupiter_ketu_conjunction=true"]
outcome = "LIFE_PHASE_SHIFT"
direction = "SUPPORT"
strength = "MODERATE"
source_id = "BPHS"
location = "Chapter 19, Verse 4"

