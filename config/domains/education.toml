[education]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Education Rules ──
# Each rule maps JRE facts to an EducationOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Higher Education ──

[[education.rules]]
rule_id = "R-EDU-HIGH-001"
description = "4th lord in kendra — higher education indicators"
condition_facts = ["4th_lord_in_kendra=true"]
outcome = "HIGHER_EDUCATION"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 17, Verse 2"

