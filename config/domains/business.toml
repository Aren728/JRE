[business]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Business Rules ──
# Each rule maps JRE facts to a BusinessOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Successful Entrepreneurship ──

[[business.rules]]
rule_id = "R-BIZ-ENTR-001"
description = "Mercury strong with 10th connection — successful entrepreneurship"
condition_facts = ["mercury_strong=true", "mercury_10th_connection=true"]
outcome = "SUCCESSFUL_ENTREPRENEURSHIP"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 21, Verse 2"

