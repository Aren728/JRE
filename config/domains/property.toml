[property]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Property Rules ──
# Each rule maps JRE facts to a PropertyOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Property Acquisition ──

[[property.rules]]
rule_id = "R-PROP-ACQ-001"
description = "4th lord strong — property acquisition indicators"
condition_facts = ["4th_lord_strong=true"]
outcome = "PROPERTY_ACQUISITION"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 18, Verse 2"

[[property.rules]]
rule_id = "R-PROP-ACQ-002"
description = "Mars strong with 4th connection — property acquisition through effort"
condition_facts = ["mars_strong=true", "mars_4th_connection=true"]
outcome = "PROPERTY_ACQUISITION"
direction = "SUPPORT"
strength = "MODERATE"
source_id = "BPHS"
location = "Chapter 18, Verse 4"

