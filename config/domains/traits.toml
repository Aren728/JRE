[traits]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Traits Rules ──
# Each rule maps JRE-027 BirthSignature facts to a TraitOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.
#
# Fact names correspond to BirthSignature fields:
#   tithi, karana, yoga, weekday, hora, day_night_period,
#   lagna, sun_rashi, moon_rashi, nakshatra, pada
#
# Condition formats:
#   fact_name          – truthy check
#   fact_name=value    – equality
#   fact_name in (v1,v2) – membership

# ── Intellectual Depth ──
# Mercury-governed factors and knowledge-oriented yogas/nakshatras indicate
# analytical and intellectual capacity.

[[traits.rules]]
rule_id = "R-TRAIT-INT-001"
description = "Mercury hora at birth — intellectual and analytical disposition"
condition_facts = ["hora=MERCURY"]
outcome = "INTELLECTUAL_DEPTH"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 2, Verse 10"

