description = "Sun in exaltation — amplified authoritative and commanding presence"
condition_facts = ["sun_avastha=EXALTED"]
outcome = "LEADERSHIP_TENDENCY"
direction = "SUPPORT"
strength = "VERY_HIGH"
source_id = "BPHS"
location = "Chapter 36, Verse 1-5"

[[traits.rules]]
