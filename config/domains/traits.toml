# ══════════════════════════════════════════════════════════════════════════════
# RI-009 Phase 1: Avastha (Planetary State) Trait Modifiers
# ══════════════════════════════════════════════════════════════════════════════
# These rules encode how planetary dignity (exaltation, debilitation,
# own sign) modifies the baseline temperament expressed through
# the Hora, Vara, and Nakshatra rules above.
#
# Source: BPHS Chapter 36 (Avastha effects), RI-009_RESEARCH_REPORT.md
# Classification: All rules below are CLASSICAL_PRIMARY (BPHS Ch.36)
#
# These are MODIFIER rules — they amplify or weaken traits already
# indicated by other factors, not standalone trait generators.
# ══════════════════════════════════════════════════════════════════════════════

# ── Sun Avastha Modifiers ───────────────────────────────────────────────────
# Sun governs authority, selfhood, and leadership.
# Exaltation amplifies authoritative qualities; debilitation weakens them.

