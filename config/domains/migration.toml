[migration]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Migration Rules ──
# Each rule maps JRE facts to a MigrationOutcomeTaxonomy.
# condition_facts uses AND logic: all must be satisfied.

# ── Foreign Settlement ──

[[migration.rules]]
rule_id = "R-MIG-FSET-001"
description = "Rahu in 12th house — foreign settlement indicators"
condition_facts = ["rahu_in_12th=true"]
outcome = "FOREIGN_SETTLEMENT"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 15, Verse 2"

[[migration.rules]]
rule_id = "R-MIG-FSET-002"
description = "9th lord in 12th with Rahu — permanent foreign settlement"
condition_facts = ["9th_lord_in_12th=true", "rahu_12th_connection=true"]
outcome = "FOREIGN_SETTLEMENT"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 15, Verse 4"

[[migration.rules]]
rule_id = "R-MIG-FSET-003"
description = "12th lord strong with Jupiter connection — foreign settlement through fortune"
condition_facts = ["12th_lord_strong=true", "jupiter_12th_connection=true"]
outcome = "FOREIGN_SETTLEMENT"
direction = "SUPPORT"
strength = "MODERATE"
source_id = "BPHS"
location = "Chapter 15, Verse 6"

