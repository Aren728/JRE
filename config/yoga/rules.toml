# ── Classical Yoga Rules ──
# Each rule defines a classical yoga with its formation conditions,
# involved planets, and outcome mapping.

# ══════════════════════════════════════════════════════════════════════════════
# Chandra Mangala Yoga (Moon + Mars conjunction)
# When Moon and Mars are in conjunction, the native earns through
# independent effort, courage, and assertiveness.
# Source: BPHS Chapter 41, Verse 10-15
# ══════════════════════════════════════════════════════════════════════════════

[[yoga.rules]]
rule_id = "R-YOGA-CM-001"
yoga_name = "Chandra Mangala"
description = "Moon and Mars in conjunction — wealth through independent effort and courage"
formation_type = "CONJUNCTION"
involved_planets = ["MOON", "MARS"]
involved_houses = []
condition_facts = ["moon_mars_conjunction=true"]
outcome = "WEALTH_ACCUMULATION"
direction = "SUPPORT"
strength = "HIGH"
source_id = "BPHS"
location = "Chapter 41, Verses 10-15"

[[yoga.rules]]
rule_id = "R-YOGA-CM-002"
yoga_name = "Chandra Mangala"
description = "Moon and Mars mutual aspect (7 houses apart) — wealth through assertive action"
formation_type = "MUTUAL_ASPECT"
involved_planets = ["MOON", "MARS"]
involved_houses = []
condition_facts = ["moon_mars_mutual_aspect=true"]
outcome = "WEALTH_ACCUMULATION"
direction = "SUPPORT"
strength = "MODERATE"
source_id = "BPHS"
location = "Chapter 41, Verses 10-15"

