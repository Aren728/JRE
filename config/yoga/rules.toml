# ══════════════════════════════════════════════════════════════════════════════
# Lakshmi Yoga (Lagna lord + 9th lord in Kendra or Trikona)
# When the 1st lord and 9th lord are placed in Kendra (1,4,7,10) or
# Trikona (1,5,9) houses, the native enjoys wealth, prosperity, and
# divine grace throughout life.
# Source: BPHS Chapter 41, Verse 30-35
# ══════════════════════════════════════════════════════════════════════════════

[[yoga.rules]]
rule_id = "R-YOGA-LK-001"
yoga_name = "Lakshmi"
description = "Lagna lord and 9th lord in Kendra — wealth and divine grace"
formation_type = "LORDS_IN_KENDRA"
involved_planets = ["LAGNA_LORD", "NINTH_LORD"]
involved_houses = [1, 4, 7, 10]
condition_facts = ["lagna_lord_in_kendra=true", "ninth_lord_in_kendra=true"]
outcome = "WEALTH_ACCUMULATION"
direction = "SUPPORT"
strength = "HIGH"
