# RI-008 Phase 1: Nakshatra-Lord Transit Intelligence Rules
# ══════════════════════════════════════════════════════════════════════════════
#
# Source: RI-008_RESEARCH_REPORT.md
# Scope: 14 findings classified as encodable via existing JRE facts
#        (JRE-003, JRE-026, JRE-010).
#
# Each rule includes:
#   - classification: CLASSICAL_PRIMARY | COMMENTARY_DEPENDENT | LATER_TRADITION
#   - source: Text/Chapter/Verse reference
#   - condition_facts: facts from JRE engines that must be satisfied
#   - outcome: temporal modifier type
#   - strength: evidence weight (0.0 to 1.0)
#
# NO new JRE engines created. Sarvatobhadra and Navatara Chakras are
# explicitly deferred to Phase 2.
# ══════════════════════════════════════════════════════════════════════════════

[nakshatra_transit]
version = "1.0"
source_id = "BPHS"
default_strength = "MODERATE"

# ── Transit Planet → Nakshatra Activation Rules ──────────────────────────────
# These rules map transit planet + Nakshatra lord relationships to
# temporal modifiers (evidence weights or convergence adjustments).

# ── CLASSICAL PRIMARY: House-based transit from Moon ──────────────────────────
# These rules are explicitly stated in classical texts.

[[nakshatra_transit.rules]]
rule_id = "R-TRANSIT-001"
description = "Transit planet enters Moon's natal Nakshatra — mental/emotional activation"
classification = "CLASSICAL_PRIMARY"
condition_facts = ["transit_in_moon_nakshatra=true"]
outcome = "TEMPORAL_MODIFIER"
direction = "SUPPORT"
strength = 0.8
source = "Phaladeepika"
location = "Chapter 26, Verse 1"
evidence_weight = 0.8

