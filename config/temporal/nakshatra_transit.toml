# EXCLUDED (Modern/Unsupported)
# The following configurations were identified in RI-008 but classified as
# UNSUPPORTED or Modern Interpretation. They are listed here explicitly
# to prevent future drift into the rule catalog.
#
# R-TRANSIT-EXCLUDED-001: "Saturn transit through your Nakshatra brings
#   inevitable hardship and karmic lessons"
#   Classification: UNSUPPORTED
#   Reason: BPHS and Saravali describe Saturn transit effects from Moon
#   sign, not from Nakshatra. The "inevitable hardship" framing is modern
#   fatalism, not classical.
#
# R-TRANSIT-EXCLUDED-002: "Jupiter transit through your Nakshatra guarantees
#   luck and abundance"
#   Classification: UNSUPPORTED
#   Reason: Phaladeepika Ch.26 describes Jupiter transit effects from Moon
#   sign in specific houses. The "guarantee" framing is modern.
#
# R-TRANSIT-EXCLUDED-003: "Rahu transit through your Nakshatra activates
#   past-life karma"
#   Classification: UNSUPPORTED
#   Reason: No classical text uses "past-life karma" language for transit
#   effects. Rahu transit effects are described from Moon sign.
#
# R-TRANSIT-EXCLUDED-004: "Ketu transit through your Nakshatra brings
#   spiritual awakening"
#   Classification: UNSUPPORTED
#   Reason: "Spiritual awakening" is modern New Age interpretation.
#   Classical texts describe Ketu transit as similar to Sun.
#
# R-TRANSIT-EXCLUDED-005: "Mercury transit through your Nakshatra activates
#   your communication gifts"
#   Classification: UNSUPPORTED
#   Reason: "Communication gifts" is modern psychological language.
#   Mercury transit effects are described house-by-house from Moon.
#
# R-TRANSIT-EXCLUDED-006: "Your Nakshatra lord's transit determines your
#   life purpose"
#   Classification: UNSUPPORTED
#   Reason: "Life purpose" is a modern coaching concept with no basis in
#   classical Jyotish.
#
# R-TRANSIT-EXCLUDED-007: "Transit through your Janma Nakshatra pada
#   activates specific chakras"
#   Classification: UNSUPPORTED
#   Reason: Chakra activation is a modern syncretic concept blending
#   Jyotish with New Age energy work.
#
# R-TRANSIT-EXCLUDED-008: "Saturn's Sade Sati is worse when it transits
#   your Nakshatra"
#   Classification: UNSUPPORTED
#   Reason: Sade Sati Nakshatra-level amplification is not in BPHS or
#   Phaladeepika.
#
# R-TRANSIT-EXCLUDED-009: "Jupiter transit through your Atmakaraka Nakshatra
#   liberates your soul"
#   Classification: UNSUPPORTED
#   Reason: "Soul liberation" through transit is modern spiritual astrology.
#
# R-TRANSIT-EXCLUDED-010: "Rahu-Ketu transit through your Dasha lord's
#   Nakshatra triggers karmic debt repayment"
#   Classification: UNSUPPORTED
#   Reason: "Karmic debt repayment" is a modern Buddhist/Hindu hybrid
#   concept not found in classical texts.
#
# R-TRANSIT-EXCLUDED-011: "Transit through your Nakshatra pada gives results
#   within 7 days"
#   Classification: UNSUPPORTED
#   Reason: No classical text specifies exact timing for Nakshatra transit
#   effects. Transit timing is Dasha-dependent.
#
# R-TRANSIT-EXCLUDED-012: "Transit effects peak when the planet crosses
#   the exact Nakshatra boundary"
#   Classification: UNSUPPORTED
#   Reason: Classical texts describe transit effects as gradual, not
#   boundary-triggered.
#
# R-TRANSIT-EXCLUDED-013: "Transit through your Nakshatra's 4th pada
#   activates career matters"
#   Classification: UNSUPPORTED
#   Reason: Pada-specific life area mapping is modern.
#
# R-TRANSIT-EXCLUDED-014: "Multiple planets transiting your Nakshatra
#   simultaneously creates a 'grand activation'"
#   Classification: UNSUPPORTED
#   Reason: "Grand activation" is modern terminology. Classical texts
#   describe each planet's transit independently.
#
# R-TRANSIT-EXCLUDED-015: "Transit through your Nakshatra during Rahu Dasha
