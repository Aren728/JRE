# JRE API — Staging Deployment Configuration
#
# Production-ready Docker Compose for beta testing.
#
# Usage:
#   docker-compose -f docker-compose.staging.yml up --build
#   docker-compose -f docker-compose.staging.yml up --build -d
#   docker-compose -f docker-compose.staging.yml down
#
# The API will be available at http://localhost:8000
# API docs at http://localhost:8000/docs
# Feedback log at ./data/feedback_log.jsonl

version: "3.8"

services:
  jre-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jre-api-staging
    ports:
      - "8000:8000"
    volumes:
      # Mount fixtures as read-only
      - ./tests/fixtures/validation_charts:/app/tests/fixtures/validation_charts:ro
      # Persistent storage for feedback log (named volume)
      - jre-feedback-data:/app/data
      # Local data directory for development
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - JRE_ENV=staging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jre-feedback-data:
    driver: local
